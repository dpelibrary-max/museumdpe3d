<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พิพิธภัณฑ์และห้องสมุด - นิทรรศการโมเดล 3 มิติ</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #121212; display: flex; flex-direction: column; }
    .menu-bar { padding: 10px; background: #1e1e1e; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #333; white-space: nowrap; }
    .menu-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .menu-btn:hover, .menu-btn.active { background: #007bff; border-color: #007bff; }
    .viewer-container { flex: 1; width: 100%; height: 100%; position: relative; }
    model-viewer { width: 100%; height: 100%; background-color: #181818; }
  </style>
</head>
<body>

  <div class="menu-bar">
    <button class="menu-btn active" onclick="loadModel('sword', this)">ดาบกระบี่กระบอง</button>
    <button class="menu-btn" onclick="loadModel('table', this)">โต๊ะอธิบดีคนแรกฯ</button>
    <button class="menu-btn" onclick="loadModel('trophy', this)">ถ้วยฟีฟ่า</button>
    <button class="menu-btn" onclick="loadModel('podium', this)">แท่นที่ประทับฯ</button>
    <button class="menu-btn" onclick="loadModel('statue', this)">พละพลบดี</button>
    <button class="menu-btn" onclick="loadModel('knight', this)">รูปปั้นอัศวินฯ</button>
    <button class="menu-btn" onclick="loadModel('plaque', this)">รูปเพลงกราวกีฬา</button>
  </div>

  <div class="viewer-container">
    <model-viewer 
      id="viewer"
      src="model/sword.glb" 
      alt="โมเดล 3 มิติ" 
      auto-rotate 
      camera-controls 
      shadow-intensity="1">
    </model-viewer>
  </div>

  <script>
    function loadModel(basePath, btn) {
      const viewer = document.getElementById('viewer');
      viewer.src = 'model/' + basePath + '.glb';
      document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
